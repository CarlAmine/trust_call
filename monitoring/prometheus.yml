global:
  scrape_interval: 5s # Scrape the AI models every 5 seconds

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'rawnet_audio_ai'
    metrics_path: '/metrics'
    static_configs:
      # host.docker.internal points to your Windows machine's localhost
      - targets: ['192.168.1.102:8000'] 

  - job_name: 'distilbert_semantic_ai'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['192.168.1.102:8002']