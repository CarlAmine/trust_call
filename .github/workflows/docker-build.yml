name: Docker Build Validation

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-rawnet-service:
    name: Build RawNet Service Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build RawNet Docker image (no push)
        run: |
          docker build ./rawnet-service -t trust-call-rawnet:ci-test

  build-distilbert-service:
    name: Build DistilBERT Service Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build DistilBERT Docker image (no push)
        run: |
          docker build ./distilbert-service -t trust-call-distilbert:ci-test

  build-backend:
    name: Build Backend Gateway Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Dockerfile exists
        run: |
          [ -f trust_call_backend/Dockerfile ] && echo "Dockerfile found" || echo "No Dockerfile"

      - name: Build backend Docker image (no push)
        run: |
          docker build -f trust_call_backend/Dockerfile . -t trust-call-backend:ci-test
