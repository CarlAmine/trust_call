version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: trust_call_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    extra_hosts:
      - "host.docker.internal:host-gateway" # Crucial for Windows so Docker can see your Python FastAPIs!

  grafana:
    image: grafana/grafana:latest
    container_name: trust_call_grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus